<style>
:root {
  --ink: #2a1c18; --paper: #fbf7ea; --cream: #fff1d2; --wine: #5b2433; --wood: #7a4a2c; --amber: #ffc857;
  --pink: #ff5fa2; --teal: #62e8de; --muted: #6a5d4e;
  --f-toon: "Caprasimo", "Cooper Black", "Bookman Old Style", Georgia, serif;
  --f-ui: "Oswald", "Arial Narrow", Arial, sans-serif;
  --f-osd: "VT323", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #08060c; overflow: hidden; }
body { font-family: var(--f-ui); color: var(--ink); -webkit-user-select: none; user-select: none; cursor: default; }
[hidden] { display: none !important; }
#stage { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #08060c; }
.sc { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; overflow: hidden; display: none; }
#stage[data-sc="out"] #scOut, #stage[data-sc="bar"] #scBar, #stage[data-sc="book"] #scBook, #stage[data-sc="sing"] #scSing { display: block; }
.weave { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; animation: weave 2s steps(1) infinite; }
.weave canvas, .weave svg { position: absolute; top: 0; left: 0; display: block; width: 1920px; height: 1080px; }
@keyframes weave { 0% { transform: translate(-.37px,-.44px); } 8% { transform: translate(-.61px,-.11px); } 17% { transform: translate(.37px,-.31px); } 25% { transform: translate(-.46px,-.43px); } 33% { transform: translate(.46px,.34px); } 42% { transform: translate(-.27px,.14px); } 50% { transform: translate(.53px,-.45px); } 58% { transform: translate(.01px,-.35px); } 67% { transform: translate(.61px,.4px); } 75% { transform: translate(.57px,.08px); } 83% { transform: translate(.01px,-.09px); } 92% { transform: translate(-.47px,-.21px); } }

/* ---------- the film transfer, over everything ---------- */
.grain { position: absolute; top: -128px; left: -128px; right: -128px; bottom: -128px; pointer-events: none; opacity: .14; background-size: 256px 256px; animation: grain .5s steps(1) infinite; z-index: 90; }
@keyframes grain { 0% { transform: translate(0,0); } 17% { transform: translate(-61px,37px); } 33% { transform: translate(43px,-89px); } 50% { transform: translate(-97px,-21px); } 67% { transform: translate(23px,71px); } 83% { transform: translate(79px,-49px); } }
.flick { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #140c06; opacity: 0; pointer-events: none; animation: filmFlick 1.75s steps(1) infinite; z-index: 91; }
@keyframes filmFlick { 0% { opacity: .02; } 14% { opacity: 0; } 29% { opacity: .035; } 43% { opacity: .01; } 57% { opacity: .03; } 71% { opacity: 0; } 86% { opacity: .025; } }
.vig { position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 92; background: radial-gradient(ellipse 75% 70% at 50% 46%, rgba(0,0,0,0) 62%, rgba(24,10,30,.34) 100%); }
#fade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #08060c; pointer-events: none; opacity: 0; transition: opacity .5s; z-index: 95; }
#fade.on { opacity: 1; }

/* inked hand lettering */
.inked { font-family: var(--f-toon); color: var(--cream);
  text-shadow: 2px 0 0 #3a1d14, -2px 0 0 #3a1d14, 0 2px 0 #3a1d14, 0 -2px 0 #3a1d14, 2px 2px 0 #3a1d14, -2px 2px 0 #3a1d14, 2px -2px 0 #3a1d14, -2px -2px 0 #3a1d14, 1px 5px 0 #3a1d14, 2px 8px 0 rgba(16,8,24,.35); }

/* ---------- outside ---------- */
#scOut { background: #1d2558; }
#outZoom { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 60.4% 64%; transition: transform .9s cubic-bezier(.5,0,.75,.25); }
#scOut.entering #outZoom { transform: scale(2.6); }
#outCam { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: 52% 0; }
#scOut.cam-in #outCam { animation: camIn 3.4s cubic-bezier(.42,0,.2,1) .2s both; }
@keyframes camIn { from { transform: scale(1.5); } to { transform: scale(1); } }
#oSky { width: 1920px; height: 1080px; }
.pan { position: absolute; top: 0; left: 0; width: 3840px; height: 640px; animation: cloudPan 760s linear infinite; }
.pan canvas { position: absolute; top: 0; left: 0; width: 1920px !important; height: 640px !important; }
.pan #oCloudB { left: 1920px; }
@keyframes cloudPan { from { transform: translate3d(0,0,0); } to { transform: translate3d(-1920px,0,0); } }
.rain { position: absolute; left: -25%; right: -25%; top: -25%; bottom: -25%; transform: rotate(9deg); pointer-events: none; }
.rain i { position: absolute; left: 0; right: 0; bottom: 0; display: block; background-repeat: repeat; }
.rain.near i { top: -320px; background-size: 320px 320px; animation: fallNear .333s steps(4) infinite; }
.rain.far i { top: -220px; background-size: 220px 220px; animation: fallFar .5s steps(6) infinite; opacity: .6; }
@keyframes fallNear { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,320px,0); } }
@keyframes fallFar { from { transform: translate3d(0,0,0); } to { transform: translate3d(0,220px,0); } }
.press { position: absolute; left: 0; right: 0; bottom: 48px; text-align: center; font-size: 50px; animation: pressBob 1.33s steps(1) infinite; transition: opacity .5s; }
@keyframes pressBob { 0% { transform: translateY(0) rotate(-1.2deg); } 50% { transform: translateY(-5px) rotate(.8deg); } }
.clock { position: absolute; top: 34px; right: 58px; font-size: 38px; opacity: .92; transition: opacity .5s; }
#scOut.cam-in .press, #scOut.cam-in .clock, #scOut.entering .press, #scOut.entering .clock { opacity: 0; }
#scOut.cam-in.cam-done .press, #scOut.cam-in.cam-done .clock { opacity: 1; }
.n-flick { animation: nflick 9s steps(1) infinite; }
@keyframes nflick { 0%, 90% { opacity: 1; } 91% { opacity: .3; } 92% { opacity: 1; } 94% { opacity: .5; } 95%, 100% { opacity: 1; } }
.n-buzz { animation: nbuzz 5.3s steps(1) infinite; }
@keyframes nbuzz { 0%, 70% { opacity: 1; } 71% { opacity: .5; } 73% { opacity: .95; } 74% { opacity: .6; } 77%, 100% { opacity: 1; } }
.disco { animation: disco 2.4s steps(1) infinite; }
@keyframes disco { 0% { fill: #ff7ab0; opacity: .22; } 25% { fill: #62e8de; opacity: .16; } 50% { fill: #ffc857; opacity: .24; } 75% { fill: #b48cff; opacity: .18; } }
.o-rip { opacity: 0; animation: rip 1.2s steps(1) infinite; }
@keyframes rip { 0% { opacity: .8; transform: scale(.5); } 17% { opacity: .55; transform: scale(1); } 33% { opacity: .25; transform: scale(1.4); } 50%, 100% { opacity: 0; } }
#oDoor { transition: transform .45s steps(5); transform-box: fill-box; transform-origin: 0 50%; }
#scOut.door-open #oDoor { transform: scaleX(.12); }
.beacon { animation: beacon 2s steps(1) infinite; }
@keyframes beacon { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
.twk { animation: twk 3.2s steps(1) infinite; }
@keyframes twk { 0%, 55% { opacity: 1; } 56%, 70% { opacity: .35; } 71%, 100% { opacity: .85; } }

/* ---------- inside the bar ---------- */
#scBar { background: #2a1420; }
.spot { position: absolute; transform: translate(-50%, -100%); padding: 8px 22px 10px; font-family: var(--f-toon); font-size: 34px; color: var(--ink); background: var(--paper); border: 4px solid var(--ink); border-radius: 10px; box-shadow: 5px 6px 0 rgba(20,8,14,.55); white-space: nowrap; opacity: .0; transition: opacity .15s; text-align: center; }
.spot small { display: block; font-family: var(--f-ui); font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: .03em; margin-top: 2px; }
.spot:after { content: ""; position: absolute; left: 50%; bottom: -18px; margin-left: -12px; border: 12px solid transparent; border-top: 16px solid var(--ink); border-bottom: 0; }
.spot.on { opacity: 1; animation: spotBob 1.33s steps(1) infinite; }
@keyframes spotBob { 0% { transform: translate(-50%, -100%) rotate(-1deg); } 50% { transform: translate(-50%, -100%) translateY(-6px) rotate(.8deg); } }
.spot-dot { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--cream); border: 4px solid var(--ink); opacity: .85; animation: dotPulse 1.5s steps(1) infinite; }
@keyframes dotPulse { 0% { transform: scale(1); } 50% { transform: scale(.72); } }
.spot-dot.on { opacity: 0; }
.hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-family: var(--f-ui); font-weight: 500; font-size: 27px; letter-spacing: .04em; color: var(--cream); text-shadow: 0 2px 0 #1a0c12, 0 0 12px rgba(10,4,8,.9); pointer-events: none; z-index: 6; }
.hint b { display: inline-block; width: 22px; height: 22px; border-radius: 50%; vertical-align: -3px; margin: 0 8px 0 26px; border: 3px solid #1a0c12; }
.hint b.r { background: #e2364a; } .hint b.g { background: #3fae5a; } .hint b.y { background: #f1c232; } .hint b.b { background: #3c78d8; }
.hint span { margin-left: 26px; }
.ball-dot { animation: ballDrift 12s steps(72) infinite; }
@keyframes ballDrift { from { transform: translateX(-140px); } to { transform: translateX(140px); } }
.ball-dot.rev { animation-direction: reverse; animation-duration: 15s; }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .5s steps(1) infinite; }
@keyframes flame { 0% { transform: scale(1,1); } 33% { transform: scale(.9,1.12); } 66% { transform: scale(1.06,.92); } }
.rh-blink { opacity: 0; animation: rhBlink 4.6s steps(1) infinite; }
@keyframes rhBlink { 0%, 93% { opacity: 0; } 94%, 97% { opacity: 1; } 98%, 100% { opacity: 0; } }

@keyframes rhEyes { 0%, 93% { opacity: 1; } 94%, 97% { opacity: 0; } 98%, 100% { opacity: 1; } }
