<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Saturday Night Karaoke · Jukebox</title>
<style>html, body { margin: 0; height: 100%; background: #000; overflow: hidden; } iframe { display: block; border: 0; width: 100%; height: 100%; }</style>
</head>
<body>
<script>
// The jukebox. The TV app plays YouTube through this page, because YouTube only plays embedded videos for a page
// that says which website it is on, and apps on a Samsung TV don't say. This page lives on the bar's own website,
// so YouTube sees a proper address. It passes messages straight through between the TV app and the YouTube player.
(function () {
  "use strict";
  var m = /[#&]v=([A-Za-z0-9_\-]{11})(?:&|$)/.exec(location.hash || "");
  if (!m || window.parent === window) return;
  var here = location.href.split("#")[0];
  var f = document.createElement("iframe");
  f.setAttribute("allow", "autoplay; encrypted-media");
  f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
  f.setAttribute("title", "Music");
  f.src = "https://www.youtube-nocookie.com/embed/" + m[1] + "?autoplay=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&enablejsapi=1" +
    "&origin=" + encodeURIComponent(location.origin) + "&widget_referrer=" + encodeURIComponent(here);
  document.body.appendChild(f);
  window.addEventListener("message", function (e) {
    if (e.source === window.parent) { try { f.contentWindow.postMessage(e.data, "*"); } catch (x) {} }
    else if (e.source === f.contentWindow) { try { window.parent.postMessage(e.data, "*"); } catch (x) {} }
  });
  try { window.parent.postMessage(JSON.stringify({ event: "snk-wrap-ready" }), "*"); } catch (x) {}
})();
</script>
</body>
</html>
