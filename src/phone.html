<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Saturday Night Karaoke · Songbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24121a">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Oswald:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root { --ink: #2a1c18; --paper: #fbf7ea; --cream: #fff1d2; --wine: #5b2433; --muted: #6a5d4e; --pink: #ff5fa2; --teal: #62e8de; --amber: #ffc857; --red: #a8323e;
  --f-toon: "Caprasimo", "Cooper Black", Georgia, serif; --f-ui: "Oswald", "Arial Narrow", Arial, sans-serif; --f-osd: "VT323", "Courier New", monospace; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #24121a; }
body { margin: 0; min-height: 100vh; font-family: var(--f-ui); font-size: 17px; color: var(--ink); background-color: var(--wine);
  background-image: linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.045) 75%), linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.045) 75%);
  background-size: 36px 36px; background-position: 0 0, 18px 18px; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { max-width: 640px; margin: 0 auto; padding: 0 12px 90px; }
header { position: relative; margin: 0 -12px; padding: 22px 60px 16px; background: #24121a; border-bottom: 4px solid var(--ink); text-align: center; }
.sign small { display: block; font-family: var(--f-toon); font-size: 25px; line-height: 1.1; color: #ffe9f2; text-shadow: 0 0 4px var(--pink), 0 0 14px var(--pink), 0 0 30px rgba(255,95,162,.55); }
.sign b { display: block; margin-top: 4px; font-weight: 600; font-size: 33px; line-height: 1.1; letter-spacing: .2em; text-indent: .2em; color: #ecfffd; text-shadow: 0 0 4px var(--teal), 0 0 14px var(--teal), 0 0 30px rgba(98,232,222,.5); }
.pill { display: inline-block; margin-top: 12px; padding: 2px 12px 3px; border-radius: 20px; background: #3a2230; color: #d9b8a0; font-size: 14px; font-weight: 500; letter-spacing: .06em; }
.pill:before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; background: #8a6a70; }
.pill.up:before { background: #6fe08a; box-shadow: 0 0 8px #6fe08a; }
#cog { position: absolute; right: 10px; top: 14px; width: 46px; height: 46px; border: 0; border-radius: 10px; background: transparent; color: #d9b8a0; font-size: 26px; line-height: 1; }
.card { margin: 14px 0 0; padding: 14px 16px 16px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 rgba(20,8,14,.5); }
.k { font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
h2 { margin: 2px 0 6px; font-family: var(--f-toon); font-weight: 400; font-size: 25px; line-height: 1.15; color: #7d1a29; }
p { margin: 8px 0; line-height: 1.42; }
p.sm { font-size: 15px; color: var(--muted); }
#upnext ol { margin: 6px 0 0; padding: 0; list-style: none; counter-reset: q; }
#upnext li { counter-increment: q; position: relative; padding: 5px 0 5px 34px; border-top: 1px solid rgba(60,90,140,.22); line-height: 1.25; }
#upnext li:before { content: counter(q); position: absolute; left: 4px; top: 3px; font-family: var(--f-osd); font-size: 25px; color: var(--red); }
#upnext li small, .now small { display: block; color: var(--muted); font-size: 14px; }
.now { font-weight: 600; font-size: 19px; line-height: 1.25; }
#askForm { display: flex; margin-top: 16px; }
#ask { flex: 1; min-width: 0; height: 50px; padding: 0 14px; border: 3px solid var(--ink); border-right: 0; border-radius: 10px 0 0 10px; background: #fff; font-size: 17px; outline: 0; -webkit-appearance: none; appearance: none; }
#ask:focus { background: #fffbe6; }
#askForm button { height: 50px; padding: 0 18px; border: 3px solid var(--ink); border-radius: 0 10px 10px 0; background: #ffe08a; font-family: var(--f-toon); font-size: 19px; }
#tabs { margin: 14px -12px 0; padding: 0 12px; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-block; margin-right: 5px; padding: 8px 14px 6px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; font-weight: 600; font-size: 16px; letter-spacing: .03em; opacity: .72; }
.tab.cur { opacity: 1; padding-top: 12px; }
#list { margin-top: 0; padding: 4px 0 6px; border-radius: 0 10px 10px 10px; }
#list h2 { margin: 10px 16px 4px; }
#list .note { padding: 6px 16px 10px; color: var(--muted); line-height: 1.42; }
.ln { display: block; position: relative; width: 100%; padding: 9px 14px 9px 66px; border: 0; border-top: 1px solid rgba(60,90,140,.22); background: transparent; text-align: left; }
.ln:active { background: #ffe08a; }
.ln .code { position: absolute; left: 12px; top: 12px; width: 48px; overflow: hidden; font-family: var(--f-osd); font-size: 21px; color: #9a8f7c; }
.ln .t { display: block; font-weight: 600; font-size: 19px; line-height: 1.2; }
.ln .a { display: block; font-size: 15px; color: var(--muted); line-height: 1.3; }
.ln .star { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--red); text-transform: uppercase; }
.veil { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(14,6,10,.7); z-index: 10; overflow-y: auto; padding: 18px 12px 30px; }
.slip { max-width: 520px; margin: 4vh auto 0; padding: 18px 18px 20px; background: #fff6c9; background-image: repeating-linear-gradient(rgba(0,0,0,0) 0 37px, rgba(60,90,140,.2) 37px 38px); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 6px 8px 0 rgba(8,4,16,.6); transform: rotate(-.6deg); position: relative; }
.slip.plain { background: var(--paper); background-image: none; transform: none; }
.slip .no { float: right; font-family: var(--f-osd); font-size: 22px; color: var(--red); }
.slip .song { margin-top: 6px; font-family: var(--f-toon); font-size: 29px; line-height: 1.1; }
.slip .art { color: var(--muted); margin-bottom: 12px; }
label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
input.field { width: 100%; height: 48px; padding: 0 12px; border: 3px solid var(--ink); border-radius: 8px; background: #fff; font-size: 18px; outline: 0; }
input.field:focus { background: #fffbe6; }
.seg { display: flex; }
.seg button { flex: 1; padding: 8px 6px 9px; border: 3px solid var(--ink); background: #fff; font-weight: 600; font-size: 16px; line-height: 1.2; }
.seg button:first-child { border-radius: 8px 0 0 8px; border-right: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.seg button.sel { background: #7d1a29; color: var(--cream); }
.btn { display: block; width: 100%; margin-top: 16px; padding: 11px 10px 13px; border: 3px solid var(--ink); border-radius: 10px; background: #ffe08a; box-shadow: 3px 4px 0 var(--ink); font-family: var(--f-toon); font-size: 21px; }
.btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.plain { background: #fff; margin-top: 12px; font-size: 18px; }
.btn[disabled] { opacity: .6; }
.msg { min-height: 22px; margin-top: 12px; font-size: 15px; line-height: 1.35; color: var(--red); }
.stamp { position: absolute; right: 10px; top: 10px; padding: 4px 12px 2px; border: 4px solid #1d7a45; border-radius: 8px; color: #1d7a45; font-family: var(--f-osd); font-size: 23px; line-height: 1.05; text-align: center; transform: rotate(9deg); background: rgba(255,246,201,.9); animation: stampIn .25s steps(3); }
@keyframes stampIn { from { transform: rotate(9deg) scale(2); opacity: 0; } to { transform: rotate(9deg) scale(1); opacity: 1; } }
#toast { position: fixed; left: 12px; right: 12px; bottom: 18px; max-width: 616px; margin: 0 auto; padding: 12px 16px 13px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 rgba(20,8,14,.6); font-family: var(--f-toon); font-size: 18px; line-height: 1.25; text-align: center; z-index: 20; }
#toast small { display: block; font-family: var(--f-ui); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
</style>
<body>
<div id="app">
  <header>
    <div class="sign"><small id="bn1">Saturday Night</small><b id="bn2">KARAOKE</b></div>
    <div class="pill" id="line">Not connected</div>
    <button id="cog" type="button" aria-label="Settings">⚙</button>
  </header>

  <section class="card" id="nopair" hidden>
    <div class="k">The phone songbook</div>
    <h2>Scan the code on the TV first</h2>
    <p>Inside the bar on the TV, walk up to the table tent on the counter marked <b>Phone requests</b>. Point this phone's camera at the code it shows, and this page opens joined to that bar.</p>
  </section>

  <section class="card" id="upnext" hidden></section>

  <main id="main" hidden>
    <form id="askForm" autocomplete="off">
      <input id="ask" type="search" placeholder="Ask for any song or singer" aria-label="Ask for any song or singer" enterkeyhint="search">
      <button type="submit">Ask</button>
    </form>
    <nav id="tabs" aria-label="Songbook sections"></nav>
    <div class="card" id="list"></div>
  </main>

  <div class="veil" id="sheet" hidden></div>
  <div id="toast" hidden role="status"></div>
</div>
