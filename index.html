<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Saturday Night Karaoke · Songbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24121a">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Oswald:wght@400;500;600&family=VT323&display=swap" rel="stylesheet">
<style>
:root { --ink: #2a1c18; --paper: #fbf7ea; --cream: #fff1d2; --wine: #5b2433; --muted: #6a5d4e; --pink: #ff5fa2; --teal: #62e8de; --amber: #ffc857; --red: #a8323e;
  --f-toon: "Caprasimo", "Cooper Black", Georgia, serif; --f-ui: "Oswald", "Arial Narrow", Arial, sans-serif; --f-osd: "VT323", "Courier New", monospace; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #24121a; }
body { margin: 0; min-height: 100vh; font-family: var(--f-ui); font-size: 17px; color: var(--ink); background-color: var(--wine);
  background-image: linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.045) 75%), linear-gradient(45deg, rgba(255,255,255,.045) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.045) 75%);
  background-size: 36px 36px; background-position: 0 0, 18px 18px; }
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { max-width: 640px; margin: 0 auto; padding: 0 12px 90px; }
header { position: relative; margin: 0 -12px; padding: 22px 60px 16px; background: #24121a; border-bottom: 4px solid var(--ink); text-align: center; }
.sign small { display: block; font-family: var(--f-toon); font-size: 25px; line-height: 1.1; color: #ffe9f2; text-shadow: 0 0 4px var(--pink), 0 0 14px var(--pink), 0 0 30px rgba(255,95,162,.55); }
.sign b { display: block; margin-top: 4px; font-weight: 600; font-size: 33px; line-height: 1.1; letter-spacing: .2em; text-indent: .2em; color: #ecfffd; text-shadow: 0 0 4px var(--teal), 0 0 14px var(--teal), 0 0 30px rgba(98,232,222,.5); }
.pill { display: inline-block; margin-top: 12px; padding: 2px 12px 3px; border-radius: 20px; background: #3a2230; color: #d9b8a0; font-size: 14px; font-weight: 500; letter-spacing: .06em; }
.pill:before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 7px; border-radius: 50%; background: #8a6a70; }
.pill.up:before { background: #6fe08a; box-shadow: 0 0 8px #6fe08a; }
#cog { position: absolute; right: 10px; top: 14px; width: 46px; height: 46px; border: 0; border-radius: 10px; background: transparent; color: #d9b8a0; font-size: 26px; line-height: 1; }
.card { margin: 14px 0 0; padding: 14px 16px 16px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 rgba(20,8,14,.5); }
.k { font-weight: 600; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--red); }
h2 { margin: 2px 0 6px; font-family: var(--f-toon); font-weight: 400; font-size: 25px; line-height: 1.15; color: #7d1a29; }
p { margin: 8px 0; line-height: 1.42; }
p.sm { font-size: 15px; color: var(--muted); }
#upnext ol { margin: 6px 0 0; padding: 0; list-style: none; counter-reset: q; }
#upnext li { counter-increment: q; position: relative; padding: 5px 0 5px 34px; border-top: 1px solid rgba(60,90,140,.22); line-height: 1.25; }
#upnext li:before { content: counter(q); position: absolute; left: 4px; top: 3px; font-family: var(--f-osd); font-size: 25px; color: var(--red); }
#upnext li small, .now small { display: block; color: var(--muted); font-size: 14px; }
.now { font-weight: 600; font-size: 19px; line-height: 1.25; }
#askForm { display: flex; margin-top: 16px; }
#ask { flex: 1; min-width: 0; height: 50px; padding: 0 14px; border: 3px solid var(--ink); border-right: 0; border-radius: 10px 0 0 10px; background: #fff; font-size: 17px; outline: 0; -webkit-appearance: none; appearance: none; }
#ask:focus { background: #fffbe6; }
#askForm button { height: 50px; padding: 0 18px; border: 3px solid var(--ink); border-radius: 0 10px 10px 0; background: #ffe08a; font-family: var(--f-toon); font-size: 19px; }
#tabs { margin: 14px -12px 0; padding: 0 12px; white-space: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
#tabs::-webkit-scrollbar { display: none; }
.tab { display: inline-block; margin-right: 5px; padding: 8px 14px 6px; border: 3px solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; font-weight: 600; font-size: 16px; letter-spacing: .03em; opacity: .72; }
.tab.cur { opacity: 1; padding-top: 12px; }
#list { margin-top: 0; padding: 4px 0 6px; border-radius: 0 10px 10px 10px; }
#list h2 { margin: 10px 16px 4px; }
#list .note { padding: 6px 16px 10px; color: var(--muted); line-height: 1.42; }
.ln { display: block; position: relative; width: 100%; padding: 9px 14px 9px 66px; border: 0; border-top: 1px solid rgba(60,90,140,.22); background: transparent; text-align: left; }
.ln:active { background: #ffe08a; }
.ln .code { position: absolute; left: 12px; top: 12px; width: 48px; overflow: hidden; font-family: var(--f-osd); font-size: 21px; color: #9a8f7c; }
.ln .t { display: block; font-weight: 600; font-size: 19px; line-height: 1.2; }
.ln .a { display: block; font-size: 15px; color: var(--muted); line-height: 1.3; }
.ln .star { display: inline-block; margin-left: 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--red); text-transform: uppercase; }
.veil { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(14,6,10,.7); z-index: 10; overflow-y: auto; padding: 18px 12px 30px; }
.slip { max-width: 520px; margin: 4vh auto 0; padding: 18px 18px 20px; background: #fff6c9; background-image: repeating-linear-gradient(rgba(0,0,0,0) 0 37px, rgba(60,90,140,.2) 37px 38px); border: 3px solid var(--ink); border-radius: 8px; box-shadow: 6px 8px 0 rgba(8,4,16,.6); transform: rotate(-.6deg); position: relative; }
.slip.plain { background: var(--paper); background-image: none; transform: none; }
.slip .no { float: right; font-family: var(--f-osd); font-size: 22px; color: var(--red); }
.slip .song { margin-top: 6px; font-family: var(--f-toon); font-size: 29px; line-height: 1.1; }
.slip .art { color: var(--muted); margin-bottom: 12px; }
label { display: block; margin: 14px 0 6px; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
input.field { width: 100%; height: 48px; padding: 0 12px; border: 3px solid var(--ink); border-radius: 8px; background: #fff; font-size: 18px; outline: 0; }
input.field:focus { background: #fffbe6; }
.seg { display: flex; }
.seg button { flex: 1; padding: 8px 6px 9px; border: 3px solid var(--ink); background: #fff; font-weight: 600; font-size: 16px; line-height: 1.2; }
.seg button:first-child { border-radius: 8px 0 0 8px; border-right: 0; }
.seg button:last-child { border-radius: 0 8px 8px 0; }
.seg button small { display: block; font-weight: 400; font-size: 12px; opacity: .8; }
.seg button.sel { background: #7d1a29; color: var(--cream); }
.btn { display: block; width: 100%; margin-top: 16px; padding: 11px 10px 13px; border: 3px solid var(--ink); border-radius: 10px; background: #ffe08a; box-shadow: 3px 4px 0 var(--ink); font-family: var(--f-toon); font-size: 21px; }
.btn:active { transform: translate(2px, 3px); box-shadow: 1px 1px 0 var(--ink); }
.btn.plain { background: #fff; margin-top: 12px; font-size: 18px; }
.btn[disabled] { opacity: .6; }
.msg { min-height: 22px; margin-top: 12px; font-size: 15px; line-height: 1.35; color: var(--red); }
.stamp { position: absolute; right: 10px; top: 10px; padding: 4px 12px 2px; border: 4px solid #1d7a45; border-radius: 8px; color: #1d7a45; font-family: var(--f-osd); font-size: 23px; line-height: 1.05; text-align: center; transform: rotate(9deg); background: rgba(255,246,201,.9); animation: stampIn .25s steps(3); }
@keyframes stampIn { from { transform: rotate(9deg) scale(2); opacity: 0; } to { transform: rotate(9deg) scale(1); opacity: 1; } }
#toast { position: fixed; left: 12px; right: 12px; bottom: 18px; max-width: 616px; margin: 0 auto; padding: 12px 16px 13px; background: var(--paper); border: 3px solid var(--ink); border-radius: 10px; box-shadow: 4px 5px 0 rgba(20,8,14,.6); font-family: var(--f-toon); font-size: 18px; line-height: 1.25; text-align: center; z-index: 20; }
#toast small { display: block; font-family: var(--f-ui); font-weight: 600; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
</style>
<body>
<div id="app">
  <header>
    <div class="sign"><small id="bn1">Saturday Night</small><b id="bn2">KARAOKE</b></div>
    <div class="pill" id="line">Not connected</div>
    <button id="cog" type="button" aria-label="Settings">⚙</button>
  </header>

  <section class="card" id="nopair" hidden>
    <div class="k">The phone songbook</div>
    <h2>Scan the code on the TV first</h2>
    <p>Inside the bar on the TV, walk up to the table tent on the counter marked <b>Phone requests</b>. Point this phone's camera at the code it shows, and this page opens joined to that bar.</p>
  </section>

  <section class="card" id="upnext" hidden></section>

  <main id="main" hidden>
    <form id="askForm" autocomplete="off">
      <input id="ask" type="search" placeholder="Ask for any song or singer" aria-label="Ask for any song or singer" enterkeyhint="search">
      <button type="submit">Ask</button>
    </form>
    <nav id="tabs" aria-label="Songbook sections"></nav>
    <div class="card" id="list"></div>
  </main>

  <div class="veil" id="sheet" hidden></div>
  <div id="toast" hidden role="status"></div>
</div>

    try { var u = unb64(str); if (u.length < 41) return null; var m = nacl.secretbox.open(u.subarray(24), u.subarray(0, 24), key); return m ? JSON.parse(fromBytes(m)) : null; } catch (e) { return null; }
  }
  function randomId(n) { var u = nacl.randomBytes(n), a = "abcdefghijklmnopqrstuvwxyz0123456789", s = ""; for (var i = 0; i < n; i++) s += a[u[i] % 36]; return s; }
  function relaySend(topic, obj, key) {
    obj.ts = Date.now();
    return fetch(relayBase() + "/" + topic, { method: "POST", body: seal(obj, key) }).then(function (r) { if (!r.ok) { var e = new Error("relay " + r.status); e.status = r.status; throw e; } });
  }
  // keeps one listening connection open, and reopens it (catching up on anything missed) when it drops
  function relayListen(topic, key, onMsg, onState) {
    var es = null, seen = {}, last = Math.floor(Date.now() / 1000), dead = false, retry = null;
    function open() {
      if (dead) return;
      try { es = new EventSource(relayBase() + "/" + topic + "/sse?since=" + last); } catch (e) { onState(false); retry = setTimeout(open, 8000); return; }
      es.onopen = function () { onState(true); };
      es.onmessage = function (e) {
        var d; try { d = JSON.parse(e.data); } catch (x) { return; }
        if (!d || d.event !== "message" || !d.message || seen[d.id]) return;
        seen[d.id] = 1; if (d.time) last = d.time;
        var m = unseal(d.message, key);
        // old slips left on the relay are ignored (ten minutes covers a phone whose clock runs a little off)
        if (m && typeof m === "object" && typeof m.ts === "number" && Math.abs(Date.now() - m.ts) < 600000) onMsg(m);
      };
      es.onerror = function () { onState(false); try { es.close(); } catch (x) {} clearTimeout(retry); retry = setTimeout(open, 5000); };
    }
    open();
    return { close: function () { dead = true; clearTimeout(retry); if (es) try { es.close(); } catch (e) {} } };
  }

  // ===== the phone songbook =====
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function enc(s) { return encodeURIComponent(s); }
  function lget(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lset(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function ldel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  var pair = null, keyBytes = null, me = lget("snk-phone-id"), line = null, lineUp = false, pending = {}, tvState = null, lastHello = 0;
  var tab = 0, asked = null, slip = null, mode = lget("snk-phone-mode") === "band" ? "band" : "back";
  var PTABS = TABS.filter(function (t) { return t.id !== "ask"; });
  if (!me) { me = randomId(12); lset("snk-phone-id", me); }

  // the code from the TV arrives after the # in the address, and is remembered on this phone
  function readPair() {
    var m = /^#?([a-z0-9]{16})\.([A-Za-z0-9_\-]{43})$/.exec(location.hash || "");
    if (m) lset("snk-phone-pair", m[1] + "." + m[2]);
    var saved = /^([a-z0-9]{16})\.([A-Za-z0-9_\-]{43})$/.exec(lget("snk-phone-pair") || "");
    if (!saved) return null;
    try { var kb = unb64(saved[2]); if (kb.length !== 32) return null; keyBytes = kb; } catch (e) { return null; }
    return { room: saved[1] };
  }
  function topicTV() { return "snk" + pair.room + "t"; }
  function topicPh() { return "snk" + pair.room + "p"; }

  var toastT = null;
  function toast(text, who, ms) {
    var el = $("toast"); el.innerHTML = "<small>" + esc(who || HOST) + "</small>" + esc(text); el.hidden = false;
    clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, ms || 4500);
  }
  function setLine(up) {
    lineUp = up; var el = $("line");
    el.className = "pill" + (up ? " up" : ""); el.textContent = up ? "On the line to the bar" : "Reaching the bar…";
    if (up && Date.now() - lastHello > 30000) { lastHello = Date.now(); send({ t: "hello" }).catch(function () {}); }
  }
  function send(obj) { obj.from = me; return relaySend(topicTV(), obj, keyBytes); }
  // send something the TV answers (a slip, the jukebox key) and wait for its answer
  function ask(obj, cb) {
    var id = randomId(12); obj.id = id;
    var t = setTimeout(function () { if (pending[id]) { delete pending[id]; cb({ ok: false, why: "silent" }); } }, 12000);
    pending[id] = function (a) { clearTimeout(t); cb(a); };
    send(obj).catch(function (e) { if (pending[id]) { clearTimeout(t); delete pending[id]; cb({ ok: false, why: e && e.status === 429 ? "busy" : "net" }); } });
  }
  function onTV(m) {
    if (m.t === "state") { tvState = m; renderState(); }
    else if (m.t === "ack" && pending[m.id]) { var f = pending[m.id]; delete pending[m.id]; f(m); }
  }
  function renderState() {
    var s = tvState; if (!s) return;
    var parts = String(s.bar || "").replace(/\s+/g, " ").trim().split(" "), last = parts.length > 1 ? parts.pop() : parts[0] || "Karaoke";
    $("bn1").textContent = parts.length && parts[0] !== last ? parts.join(" ") : ""; $("bn2").textContent = last.toUpperCase();
    document.title = (s.bar || "Karaoke") + " · Songbook";
    var h = "";
    if (s.now) h += '<div class="k">Now singing</div><div class="now">' + esc(s.now.s) + "<small>" + esc(s.now.t) + " — " + esc(s.now.a) + "</small></div>";
    if (s.q && s.q.length) {
      h += '<div class="k"' + (s.now ? ' style="margin-top:12px"' : "") + ">Up next</div><ol>" + s.q.map(function (q) { return "<li>" + esc(q.s) + "<small>" + esc(q.t) + " — " + esc(q.a) + "</small></li>"; }).join("") + "</ol>";
      if (s.n > s.q.length) h += '<p class="sm">…and ' + (s.n - s.q.length) + " more.</p>";
    } else if (!s.now) h += '<div class="k">Up next</div><p class="sm" style="margin-bottom:0">Nobody on the list yet. Yours could be first.</p>';
    if (!s.key) h += '<p class="sm" style="margin-bottom:0">The TV’s jukebox key isn’t set yet, so only the house song will play. Tap the cog to send one.</p>';
    $("upnext").innerHTML = h; $("upnext").hidden = false;
  }

  // ---------- the book ----------
  function lineHTML(s, i, from) {
    return '<button type="button" class="ln" data-from="' + from + '" data-i="' + i + '"><span class="code">' + (s.code || "····") + '</span><span class="t">' + esc(s.t) + (s.note ? '<span class="star">' + esc(s.note) + "</span>" : "") + '</span><span class="a">' + esc(s.a) + (s.y ? " · " + s.y : "") + "</span></button>";
  }
  function renderTabs() {
    $("tabs").innerHTML = PTABS.map(function (t, i) { return '<button type="button" class="tab' + (i === tab && !asked ? " cur" : "") + '" data-i="' + i + '" style="background:' + t.c + '">' + esc(t.n) + "</button>"; }).join("");
  }
  var shown = [];
  function renderList() {
    renderTabs();
    var h = "";
    if (asked) {
      h += "<h2>“" + esc(asked.q) + "”</h2>";
      if (asked.state) h += '<div class="note">' + esc(asked.state) + "</div>";
      shown = asked.res; h += shown.map(function (s, i) { return lineHTML(s, i, "ask"); }).join("");
    } else {
      shown = tabSongs(PTABS[tab].id);
      h += "<h2>" + esc(PTABS[tab].h) + "</h2>" + shown.map(function (s, i) { return lineHTML(s, i, "tab"); }).join("");
    }
    $("list").innerHTML = h;
  }
  function doAsk(q) {
    q = q.replace(/\s+/g, " ").trim(); if (!q) { asked = null; renderList(); return; }
    asked = { q: q, state: HOST + " is flicking through her folders…", res: [] }; renderList();
    var mine = asked;
    fetch("https://lrclib.net/api/search?q=" + enc(q)).then(function (r) { if (!r.ok) throw new Error("http"); return r.json(); }).then(function (list) {
      if (asked !== mine) return;
      var seen = {}, out = [];
      (list || []).forEach(function (x) {
        if (x.instrumental || !(x.syncedLyrics || x.plainLyrics) || !x.trackName || !x.artistName) return;
        var k = norm(x.artistName) + "|" + norm(x.trackName), have = seen[k];
        if (have) { if (x.syncedLyrics) have.note = ""; return; }
        out.push(seen[k] = { t: x.trackName, a: x.artistName, y: 0, f: "", note: x.syncedLyrics ? "" : "words only" });
      });
      asked.res = out.slice(0, 40); asked.state = out.length ? "" : "“Sorry love, I can’t find the words for that one.” Try the song title and the singer together.";
      renderList();
    }).catch(function () { if (asked !== mine) return; asked.state = "Couldn’t reach the lyrics library. Check this phone’s connection and ask again."; renderList(); });
  }

  // ---------- the slip ----------
  function openSlip(song) {
    slip = { song: song, sent: false };
    var h = '<div class="slip"><div class="k">Request slip</div><div class="song">' + esc(song.t) + '</div><div class="art">' + esc(song.a) + (song.y ? " · " + song.y : "") + "</div>" +
      '<label for="singer">Who’s singing</label><input class="field" id="singer" maxlength="18" autocomplete="given-name" placeholder="Your name" value="' + esc(lget("snk-phone-name") || "") + '">';
    if (!song.house) h += '<label>The music</label><div class="seg"><button type="button" data-m="back"' + (mode === "back" ? ' class="sel"' : "") + '>Backing track<small>just the music</small></button><button type="button" data-m="band"' + (mode === "band" ? ' class="sel"' : "") + ">With the band<small>the record, vocals and all</small></button></div>";
    h += '<button type="button" class="btn" id="sendSlip">Send it to ' + esc(HOST) + '</button><button type="button" class="btn plain" id="closeSheet">Never mind</button><div class="msg" id="slipMsg" role="status"></div></div>';
    $("sheet").innerHTML = h; $("sheet").hidden = false;
  }
  function closeSheet() { $("sheet").hidden = true; $("sheet").innerHTML = ""; slip = null; }
  var WHY = {
    silent: "No answer from the bar. Is the TV on, with the karaoke bar open?",
    net: "Couldn’t reach the relay. Check this phone’s connection and try again.",
    busy: "The line’s busy. Give it a minute and try again.",
    full: "The request board is full. Try again after a few songs.",
    bad: "The bar couldn’t read that one. Try again.",
    closed: "Open “Jukebox key” on the TV first: ring the bell on the counter, choose Jukebox key, and keep that card open."
  };
  function sendSlip() {
    if (!slip || slip.sent) return;
    var name = $("singer").value.replace(/\s+/g, " ").trim().slice(0, 18), btn = $("sendSlip"), msg = $("slipMsg"), s = slip.song;
    if (!name) { msg.textContent = "Put a name on the slip so " + HOST + " can call you up."; $("singer").focus(); return; }
    lset("snk-phone-name", name); slip.sent = true; btn.disabled = true; btn.textContent = "Handing it over…"; msg.textContent = "";
    var mine = slip;
    ask({ t: "req", singer: name, mode: mode, song: { t: s.t, a: s.a, y: s.y || 0, house: !!s.house } }, function (a) {
      if (slip !== mine) { if (a.ok) toast("Got it, " + name + ". You’re number " + a.pos + " on the list."); return; }
      if (!a.ok) { slip.sent = false; btn.disabled = false; btn.textContent = "Send it to " + HOST; msg.textContent = WHY[a.why] || WHY.bad; return; }
      btn.textContent = "On the list";
      var st = document.createElement("div"); st.className = "stamp"; st.innerHTML = "ON THE LIST<br>No. " + (+a.pos || 1); $("sheet").querySelector(".slip").appendChild(st);
      setTimeout(function () { if (slip === mine) closeSheet(); toast("Got it, " + name + ". You’re number " + (+a.pos || 1) + " on the list."); }, 1500);
    });
  }

  // ---------- settings ----------
  function openSettings() {
    slip = null;
    $("sheet").innerHTML = '<div class="slip plain"><div class="k">Behind the bar</div><h2>The jukebox key</h2>' +
      "<p>The TV needs a free key from Google before it can play anything but the house song. Sending it from here saves typing it with the remote.</p>" +
      '<p class="sm">On the TV: ring the bell on the counter, choose <b>Jukebox key</b>, and leave that card open. Then paste the key here and send it.</p>' +
      '<label for="ytkey">Key from Google</label><input class="field" id="ytkey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">' +
      '<button type="button" class="btn" id="sendKey">Send the key to the TV</button><div class="msg" id="keyMsg" role="status"></div>' +
      '<h2 style="margin-top:18px">This phone</h2><p class="sm">This phone is joined to one bar. Forgetting it means scanning the code on the TV again.</p>' +
      '<button type="button" class="btn plain" id="forget">Forget this bar</button><button type="button" class="btn plain" id="closeSheet">Close</button></div>';
    $("sheet").hidden = false;
  }
  function sendKey() {
    var k = $("ytkey").value.replace(/\s/g, ""), msg = $("keyMsg"), btn = $("sendKey");
    if (!/^[A-Za-z0-9_\-]{20,60}$/.test(k)) { msg.textContent = "That doesn’t look like a key. It’s about 39 letters and numbers, usually starting with AIza."; return; }
    btn.disabled = true; msg.textContent = "Sending…";
    ask({ t: "key", key: k }, function (a) {
      if (!$("keyMsg")) return;
      btn.disabled = false;
      if (a.ok) { $("ytkey").value = ""; msg.style.color = "#1d7a45"; msg.textContent = "The TV has it. The jukebox is plugged in."; }
      else { msg.style.color = ""; msg.textContent = a.why === "bad" ? "The TV didn’t accept that key. Check it and try again." : WHY[a.why] || WHY.silent; }
    });
  }

  // ---------- taps ----------
  document.addEventListener("click", function (e) {
    var t = e.target, el;
    if ((el = t.closest(".ln"))) { var s = shown[+el.getAttribute("data-i")]; if (s) openSlip(s); }
    else if ((el = t.closest(".tab"))) { tab = +el.getAttribute("data-i"); asked = null; $("ask").value = ""; renderList(); }
    else if ((el = t.closest(".seg button"))) { mode = el.getAttribute("data-m"); lset("snk-phone-mode", mode); Array.prototype.forEach.call(el.parentNode.children, function (b) { b.className = b === el ? "sel" : ""; }); }
    else if (t.id === "sendSlip") sendSlip();
    else if (t.id === "closeSheet" || t === $("sheet")) closeSheet();
    else if (t.id === "cog") { if (pair) openSettings(); }
    else if (t.id === "sendKey") sendKey();
    else if (t.id === "forget") { ldel("snk-phone-pair"); try { history.replaceState(null, "", location.pathname); } catch (x) {} location.reload(); }
  });
  $("askForm").addEventListener("submit", function (e) { e.preventDefault(); $("ask").blur(); doAsk($("ask").value); });
  $("ask").addEventListener("search", function () { if (!$("ask").value) { asked = null; renderList(); } });

  // ---------- open up ----------
  function start() {
    pair = readPair();
    if (!pair) { $("nopair").hidden = false; $("main").hidden = true; $("upnext").hidden = true; $("line").textContent = "Not joined to a bar"; return; }
    $("nopair").hidden = true; $("main").hidden = false;
    renderList();
    if (!window.EventSource) { $("line").textContent = "This browser can’t hold the line open"; return; }
    if (line) line.close();
    line = relayListen(topicPh(), keyBytes, onTV, setLine);
    lastHello = Date.now(); send({ t: "hello" }).catch(function () {});
  }
  window.addEventListener("hashchange", start);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && pair && Date.now() - lastHello > 60000) { lastHello = Date.now(); send({ t: "hello" }).catch(function () {}); } });
  start();

})();
</script>
</body>
</html>
